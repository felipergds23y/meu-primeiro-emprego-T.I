
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Primeiro Emprego em TI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            font-size: 28px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        jornada {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>Meu Primeiro Emprego em TI</h1>

    <p>
        Seu caminho para começar uma carreira em Tecnologia da Informação.
    </p>

    <button onclick="comecar()">
        Começar minha jornada
    </button>

    <div id="jornada" style="display: none;">

        <h2>🚀 Sua jornada em TI</h2>

        <p>
            Escolha o primeiro passo:
        </p>

        <button>💻 Conhecer TI</button>

        <button>📚 Fazer cursos</button>

        <button>🧑‍💻 Aprender programação</button>

        <button>🛠️ Criar projetos</button>

        <button>📄 Preparar currículo</button>

        <button>🎯 Procurar emprego</button>

    </div>

    <script>
        function comecar() {
            document.getElementById("jornada").style.display = "block";
        }
    </script>

</body>

</html>
