<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Primeiro Emprego em TI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            font-size: 28px;
        }

        h3 {
            margin-top: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #jornada {
            margin-top: 30px;
        }

        #progresso {
            margin: 25px auto;
            max-width: 500px;
        }

        #barra-fundo {
            width: 100%;
            height: 25px;
            background-color: #ddd;
            border-radius: 15px;
            overflow: hidden;
        }

        #barra {
            width: 0%;
            height: 100%;
            background-color: #4caf50;
            transition: width 0.5s;
        }

        #conteudo {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            text-align: left;
        }

        #conteudo h2 {
            text-align: center;
        }

        .concluido {
            background-color: #4caf50;
            color: white;
        }

        .quiz {
            text-align: center;
            margin-top: 30px;
            padding: 25px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .resposta {
            display: block;
            margin: 10px auto;
            width: 80%;
        }

        #resultado {
            font-weight: bold;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <h1>Meu Primeiro Emprego em TI</h1>

    <p>
        Seu caminho para começar uma carreira em Tecnologia da Informação.
    </p>

    <button onclick="comecar()">
        Começar minha jornada
    </button>


    <div id="jornada" style="display: none;">

        <h2>🚀 Sua jornada em TI</h2>

        <div id="progresso">

            <p id="textoProgresso">
                0 de 6 etapas concluídas
            </p>

            <div id="barra-fundo">

                <div id="barra"></div>

            </div>

        </div>


        <p>
            Escolha uma etapa:
        </p>


        <button id="botao1" onclick="conhecerTI()">
            💻 Conhecer TI
        </button>

        <button id="botao2" onclick="fazerCursos()">
            📚 Fazer cursos
        </button>

        <button id="botao3" onclick="aprenderProgramacao()">
            🧑‍💻 Aprender programação
        </button>

        <button id="botao4" onclick="criarProjetos()">
            🛠️ Criar projetos
        </button>

        <button id="botao5" onclick="prepararCurriculo()">
            📄 Preparar currículo
        </button>

        <button id="botao6" onclick="procurarEmprego()">
            🎯 Procurar emprego
        </button>

    </div>


    <div id="conteudo"></div>


    <script>

        let etapas = JSON.parse(
            localStorage.getItem("etapasTI")
        ) || [
            false,
            false,
            false,
            false,
            false,
            false
        ];


        let etapasConcluidas = etapas.filter(
            etapa => etapa === true
        ).length;


        function comecar() {

            document.getElementById("jornada").style.display = "block";

            atualizarProgresso();

        }


        function atualizarProgresso() {

            document.getElementById("textoProgresso").innerHTML =
                etapasConcluidas + " de 6 etapas concluídas";


            let porcentagem =
                (etapasConcluidas / 6) * 100;


            document.getElementById("barra").style.width =
                porcentagem + "%";


            for (let i = 0; i < 6; i++) {

                if (etapas[i] === true) {

                    let botao =
                        document.getElementById("botao" + (i + 1));

                    botao.classList.add("concluido");

                    if (!botao.innerHTML.includes("Concluído")) {

                        botao.innerHTML += " ✓ Concluído";

                    }

                }

            }

        }


        function concluirEtapa(numero) {

            if (etapas[numero] === false) {

                etapas[numero] = true;

                etapasConcluidas++;

                localStorage.setItem(
                    "etapasTI",
                    JSON.stringify(etapas)
                );

                atualizarProgresso();

            }

        }


        function conhecerTI() {

            document.getElementById("conteudo").innerHTML =

                "<h2>💻 Conhecendo a Tecnologia da Informação</h2>" +

                "<h3>O que é TI?</h3>" +

                "<p>" +
                "TI significa Tecnologia da Informação. " +
                "É a área responsável por utilizar computadores, " +
                "programas, sistemas e redes para criar soluções." +
                "</p>";

            concluirEtapa(0);

        }


        function fazerCursos() {

            document.getElementById("conteudo").innerHTML =

                "<h2>📚 Fazer cursos</h2>" +

                "<p>" +
                "Comece pelos fundamentos de informática e depois " +
                "avance para programação e desenvolvimento." +
                "</p>";

            concluirEtapa(1);

        }


        function aprenderProgramacao() {

            document.getElementById("conteudo").innerHTML =

                "<h2>🧑‍💻 Aprendendo programação</h2>" +

                "<p>" +
                "Programar é ensinar o computador a realizar tarefas " +
                "através de instruções." +
                "</p>" +

                "<h3>🌐 HTML</h3>" +

                "<p>" +
                "HTML cria a estrutura da página." +
                "</p>" +

                "<h3>🎨 CSS</h3>" +

                "<p>" +
                "CSS controla a aparência da página." +
                "</p>" +

                "<h3>⚙️ JavaScript</h3>" +

                "<p>" +
                "JavaScript cria ações e interações na página." +
                "</p>" +

                "<div class='quiz'>" +

                "<h3>🧠 QUIZ</h3>" +

                "<p>" +
                "<strong>Qual linguagem usamos para criar interações em uma página?</strong>" +
                "</p>" +

                "<button class='resposta' onclick='responderQuiz(false)'>" +
                "HTML" +
                "</button>" +

                "<button class='resposta' onclick='responderQuiz(false)'>" +
                "CSS" +
                "</button>" +

                "<button class='resposta' onclick='responderQuiz(true)'>" +
                "JavaScript" +
                "</button>" +

                "<p id='resultado'></p>" +

                "</div>";

        }


        function responderQuiz(correto) {

            let resultado =
                document.getElementById("resultado");


            if (correto === true) {

                resultado.innerHTML =
                    "🎉 PARABÉNS! Você acertou! JavaScript cria interações na página.";

                concluirEtapa(2);

            } else {

                resultado.innerHTML =
                    "❌ Resposta incorreta. Tente novamente!";

            }

        }


        function criarProjetos() {

            document.getElementById("conteudo").innerHTML =

                "<h2>🛠️ Criar projetos</h2>" +

                "<p>" +
                "Projetos práticos ajudam você a desenvolver experiência " +
                "e montar um portfólio." +
                "</p>";

            concluirEtapa(3);

        }


        function prepararCurriculo() {

            document.getElementById("conteudo").innerHTML =

                "<h2>📄 Preparar currículo</h2>" +

                "<p>" +
                "Seu currículo deve mostrar seus cursos, conhecimentos, " +
                "projetos e habilidades." +
                "</p>";

            concluirEtapa(4);

        }


        function procurarEmprego() {

            document.getElementById("conteudo").innerHTML =

                "<h2>🎯 Procurar emprego</h2>" +

                "<p>" +
                "Depois de aprender e criar projetos, você poderá " +
                "começar a procurar oportunidades em TI." +
                "</p>";

            concluirEtapa(5);

        }


        atualizarProgresso();

    </script>

</body>

</html>
