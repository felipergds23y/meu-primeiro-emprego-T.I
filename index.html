
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Primeiro Emprego em TI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            font-size: 28px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #jornada {
            margin-top: 30px;
        }

        #progresso {
            margin: 25px auto;
            max-width: 500px;
        }

        #barra-fundo {
            width: 100%;
            height: 25px;
            background-color: #ddd;
            border-radius: 15px;
            overflow: hidden;
        }

        #barra {
            width: 0%;
            height: 100%;
            background-color: #4caf50;
            transition: width 0.5s;
        }

        #conteudo {
            margin-top: 30px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Meu Primeiro Emprego em TI</h1>

    <p>
        Seu caminho para começar uma carreira em Tecnologia da Informação.
    </p>

    <button onclick="comecar()">
        Começar minha jornada
    </button>

    <div id="jornada" style="display: none;">

        <h2>🚀 Sua jornada em TI</h2>

        <div id="progresso">

            <p id="textoProgresso">
                0 de 6 etapas concluídas
            </p>

            <div id="barra-fundo">
                <div id="barra"></div>
            </div>

        </div>

        <p>
            Escolha o próximo passo:
        </p>

        <button onclick="conhecerTI()">
            💻 Conhecer TI
        </button>

        <button onclick="fazerCursos()">
            📚 Fazer cursos
        </button>

        <button onclick="aprenderProgramacao()">
            🧑‍💻 Aprender programação
        </button>

        <button onclick="criarProjetos()">
            🛠️ Criar projetos
        </button>

        <button onclick="prepararCurriculo()">
            📄 Preparar currículo
        </button>

        <button onclick="procurarEmprego()">
            🎯 Procurar emprego
        </button>

    </div>

    <div id="conteudo"></div>

    <script>

        let etapasConcluidas = 0;

        function comecar() {
            document.getElementById("jornada").style.display = "block";
        }

        function concluirEtapa() {

            if (etapasConcluidas < 6) {
                etapasConcluidas++;

                document.getElementById("textoProgresso").innerHTML =
                    etapasConcluidas + " de 6 etapas concluídas";

                let porcentagem = (etapasConcluidas / 6) * 100;

                document.getElementById("barra").style.width =
                    porcentagem + "%";
            }
        }

        function conhecerTI() {

            document.getElementById("conteudo").innerHTML =
                "<h2>💻 Conhecendo a TI</h2>" +
                "<p>TI significa Tecnologia da Informação.</p>" +
                "<p>É uma área que envolve computadores, sistemas, aplicativos, sites, redes e tecnologia.</p>";

            concluirEtapa();
        }

        function fazerCursos() {

            document.getElementById("conteudo").innerHTML =
                "<h2>📚 Fazer cursos</h2>" +
                "<p>Comece pelos fundamentos de informática e depois avance para programação e desenvolvimento.</p>";

            concluirEtapa();
        }

        function aprenderProgramacao() {

            document.getElementById("conteudo").innerHTML =
                "<h2>🧑‍💻 Aprender programação</h2>" +
                "<p>Você vai aprender a criar programas e aplicativos usando linguagens de programação.</p>";

            concluirEtapa();
        }

        function criarProjetos() {

            document.getElementById("conteudo").innerHTML =
                "<h2>🛠️ Criar projetos</h2>" +
                "<p>Projetos práticos ajudam você a desenvolver experiência e montar um portfólio.</p>";

            concluirEtapa();
        }

        function prepararCurriculo() {

            document.getElementById("conteudo").innerHTML =
                "<h2>📄 Preparar currículo</h2>" +
                "<p>Seu currículo deve mostrar seus cursos, conhecimentos, projetos e habilidades.</p>";

            concluirEtapa();
        }

        function procurarEmprego() {

            document.getElementById("conteudo").innerHTML =
                "<h2>🎯 Procurar seu primeiro emprego</h2>" +
                "<p>Agora você poderá começar a procurar oportunidades de estágio, aprendiz e primeiro emprego em TI.</p>";

            concluirEtapa();

            if (etapasConcluidas === 6) {
                document.getElementById("conteudo").innerHTML +=
                    "<h2>🎉 Parabéns!</h2>" +
                    "<p>Você concluiu sua jornada inicial em TI!</p>";
            }
        }

    </script>

</body>

</html>
